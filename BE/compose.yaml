services:
  api:
    build:
      context: .
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Server=sqlserver,1433;Database=ProductCatalogDb;User Id=sa;Password=${SA_PASSWORD:-Your_password123};TrustServerCertificate=True
      Jwt__Key: ${JWT_KEY:-local-development-signing-key-change-me-2026}
      AdminSeed__Password: ${ADMIN_SEED_PASSWORD:-Admin123!}
      Smtp__Host: mailpit
      Smtp__Port: 1025
      PasswordReset__ResetUrl: ${PASSWORD_RESET_URL:-http://localhost:4200/reset-password}
    depends_on:
      sqlserver:
        condition: service_healthy
      mailpit:
        condition: service_started

  # Local SMTP sandbox: catches every outgoing e-mail. Inbox UI: http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.32.0
    ports:
      - "1025:1025"
      - "8025:8025"

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    ports:
      - "1433:1433"
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SA_PASSWORD:-Your_password123}
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s

volumes:
  sqlserver-data:
