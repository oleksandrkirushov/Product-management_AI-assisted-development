@if (currentUser(); as user) {
  <header class="app-header">
    <nav class="app-header__nav" aria-label="Primary">
      <a
        class="app-header__link"
        routerLink="/products"
        routerLinkActive="app-header__link--active"
        [ariaCurrentWhenActive]="true"
      >
        Products
      </a>
      <a
        *appHasPermission="'users:read'"
        class="app-header__link"
        routerLink="/admin"
        routerLinkActive="app-header__link--active"
        [ariaCurrentWhenActive]="true"
      >
        Admin
      </a>
    </nav>
    <app-profile-menu class="app-header__profile" [user]="user" />
  </header>
}
