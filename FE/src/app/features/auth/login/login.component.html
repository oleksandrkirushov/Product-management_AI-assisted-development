<div class="login-container">
  <header class="login-header">
    <h1 class="login-header__title">Login</h1>
  </header>

  <section class="login-form-section">
    @if (errorMessage()) {
      <div
        class="error-banner"
        role="alert"
        aria-live="polite"
        aria-atomic="true"
      >
        {{ errorMessage() }}
      </div>
    }

    <form
      [formGroup]="form"
      (submit)="submit(); $event.preventDefault()"
      class="login-form"
      aria-label="Login form"
    >
      <div class="form-group">
        <label for="username" class="form-label">Username</label>
        <input
          id="username"
          type="text"
          class="form-input"
          formControlName="username"
          autocomplete="username"
          [attr.aria-invalid]="
            usernameControl()?.invalid && usernameControl()?.touched
          "
          [attr.aria-describedby]="
            usernameControl()?.invalid && usernameControl()?.touched
              ? 'username-error'
              : null
          "
        />
        @if (
          usernameControl()?.touched && usernameControl()?.hasError('required')
        ) {
          <p id="username-error" class="error-message" role="alert">
            Username is required
          </p>
        }
      </div>

      <div class="form-group">
        <label for="password" class="form-label">Password</label>
        <input
          id="password"
          type="password"
          class="form-input"
          formControlName="password"
          autocomplete="current-password"
          [attr.aria-invalid]="
            passwordControl()?.invalid && passwordControl()?.touched
          "
          [attr.aria-describedby]="
            passwordControl()?.invalid && passwordControl()?.touched
              ? 'password-error'
              : null
          "
        />
        @if (
          passwordControl()?.touched && passwordControl()?.hasError('required')
        ) {
          <p id="password-error" class="error-message" role="alert">
            Password is required
          </p>
        }
      </div>

      <button
        type="submit"
        class="submit-button"
        [disabled]="isLoading()"
        [attr.aria-busy]="isLoading()"
      >
        @if (isLoading()) {
          <span class="button-text">Logging in…</span>
        } @else {
          <span class="button-text">Login</span>
        }
      </button>
    </form>

    <p class="login-register-link">
      Don't have an account? <a routerLink="/register">Sign up</a>
    </p>
  </section>
</div>
